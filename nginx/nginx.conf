server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузки отчётов/вывода не ограничиваем жёстко
    client_max_body_size 32m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси API на бэкенд. Имя сервиса в сети docker-compose = backend.
    # Фронт обращается по относительному /api, поэтому хост нигде не захардкожен.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Сканы и аудит выполняются долго — поднимаем таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering       off;
    }

    # Swagger бэкенда доступен и через 80-й порт
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:5000$request_uri;
        proxy_set_header Host $host;
    }

    error_page 404 /index.html;
}
