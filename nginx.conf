daemon off;                     # чтобы nginx работал в foreground (удобно для скрипта)
error_log /dev/stdout info;
pid /tmp/nginx.pid;

events {}

http {
    include /etc/nginx/mime.types;   # если нужно, укажите путь к mime.types
    default_type application/octet-stream;

    server {
        listen 8080;
        server_name localhost;

        root /path/to/your/project/nmap-panel/dist;   # УКАЖИТЕ АБСОЛЮТНЫЙ ПУТЬ
        index index.html;

        # Раздача статики
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Прокси API на бэкенд (работает на 8000)
        location /api/ {
            proxy_pass http://127.0.0.1:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}