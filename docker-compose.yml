services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # slim = только apt-инструменты (быстрая сборка); full = + Go/pipx/testssl
        TOOLS_PROFILE: ${TOOLS_PROFILE:-full}
    container_name: nmap-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./scans:/app/scans
      - ./backend/nmap_panel.db:/app/nmap_panel.db
      # изолируем рабочие каталоги запусков и кэш инструментов от хоста
      - audit-runs:/app/audit_runs
      - terminal-runs:/app/terminal_runs
      - tool-cache:/root/.config
    environment:
      - DB_PATH=/app/nmap_panel.db
    ports:
      - "5000:5000"
    networks:
      - nmap-network

  nginx:
    image: nginx:alpine
    container_name: nmap-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      # собранная панель лежит в репозитории — Node на хосте не нужен.
      # Пересобрать: cd nmap-panel && pnpm install && pnpm build
      # Собрать внутри Docker: docker compose -f docker-compose.yml -f docker-compose.build.yml up --build
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nmap-panel/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - nmap-network

networks:
  nmap-network:
    driver: bridge

volumes:
  audit-runs:
  terminal-runs:
  tool-cache: