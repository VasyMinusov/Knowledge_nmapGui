services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # slim = только apt-инструменты (быстрая сборка); full = + Go/pipx/testssl
        TOOLS_PROFILE: ${TOOLS_PROFILE:-full}
    container_name: nmap-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./scans:/app/scans
      - ./backend/nmap_panel.db:/app/nmap_panel.db
      # изолируем рабочие каталоги запусков и кэш инструментов от хоста
      - audit-runs:/app/audit_runs
      - terminal-runs:/app/terminal_runs
      - tool-cache:/root/.config
    environment:
      - DB_PATH=/app/nmap_panel.db
    ports:
      - "5000:5000"
    networks:
      - nmap-network

  nginx:
    build:
      # контекст — корень репо: образ сам собирает фронт и кладёт nginx.conf,
      # монтирования собранного dist с хоста больше не нужно (Windows-friendly)
      context: .
      dockerfile: nmap-panel/Dockerfile
      args:
        # пусто => фронт ходит на относительный /api (nginx проксирует на backend).
        # Переопределить только если фронт и бэк на разных origin.
        VITE_API_BASE: ${VITE_API_BASE:-}
    container_name: nmap-nginx
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - nmap-network

networks:
  nmap-network:
    driver: bridge

volumes:
  audit-runs:
  terminal-runs:
  tool-cache: